<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .primary { fill: #E8E8E8; }
      .secondary { fill: #E8E8E8; opacity: 0.25; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="512" height="512" rx="64"/>

  <!-- Outer frame — abstracted terminal window -->
  <rect class="secondary" x="80" y="80" width="352" height="352" rx="16" fill="none" stroke="#E8E8E8" stroke-width="3" opacity="0.15"/>

  <!-- T letterform constructed from terminal geometry -->
  <!-- Horizontal bar of T -->
  <rect class="primary" x="136" y="152" width="240" height="36" rx="4"/>

  <!-- Vertical stroke of T -->
  <rect class="primary" x="232" y="152" width="48" height="208" rx="4"/>

  <!-- Cursor blink at base of T -->
  <rect class="primary" x="232" y="376" width="48" height="8" rx="2" opacity="0.5"/>

  <!-- Corner accents — terminal chrome hints -->
  <rect class="secondary" x="88" y="88" width="24" height="3" rx="1"/>
  <rect class="secondary" x="88" y="88" width="3" height="24" rx="1"/>

  <rect class="secondary" x="400" y="88" width="24" height="3" rx="1"/>
  <rect class="secondary" x="421" y="88" width="3" height="24" rx="1"/>

  <rect class="secondary" x="88" y="421" width="24" height="3" rx="1"/>
  <rect class="secondary" x="88" y="400" width="3" height="24" rx="1"/>

  <rect class="secondary" x="400" y="421" width="24" height="3" rx="1"/>
  <rect class="secondary" x="421" y="400" width="3" height="24" rx="1"/>

</svg>