<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&amp;display=swap');
      .bg { fill: #0A0A0A; }
      .mark { fill: #E8E8E8; }
      .dim { fill: #E8E8E8; opacity: 0.35; }
      .text { fill: #E8E8E8; font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="960" height="240" rx="24"/>

  <!-- Mark: prompt chevron -->
  <polygon class="mark" points="48,68 144,120 48,172 48,148 120,120 48,92"/>

  <!-- Cursor -->
  <rect class="mark" x="152" y="148" width="56" height="12" rx="1"/>

  <!-- Wordmark -->
  <text class="text" x="240" y="138" font-size="56" letter-spacing="-1">Terminal</text>
  <text class="text dim" x="658" y="138" font-size="56" letter-spacing="-1">UI</text>

</svg>