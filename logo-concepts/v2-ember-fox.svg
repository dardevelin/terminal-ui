<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bg { fill: #08080A; }
      .pri { fill: #D4D4D8; }
      .dim { fill: #D4D4D8; opacity: 0.15; }
      .glow { fill: #A1F0C4; }
    </style>
  </defs>

  <rect class="bg" width="512" height="512" rx="56"/>

  <!--
    EMBER — geometric fox
    Sharp. Quick. Elegant. Angular geometry only.
    Constructed purely from triangles and clean lines.
    Foxes = clever, fast, nocturnal. Not Firefox — this is architectural.
  -->

  <!-- Left ear -->
  <polygon class="pri" points="160,108 196,220 124,220"/>

  <!-- Right ear -->
  <polygon class="pri" points="352,108 388,220 316,220"/>

  <!-- Head — large angular face shield -->
  <polygon class="pri" points="124,220 256,168 388,220 360,332 256,372 152,332"/>

  <!-- Inner face — dark cut creating the fox mask shape -->
  <polygon class="bg" points="172,236 256,204 340,236 320,312 256,340 192,312"/>

  <!-- Nose bridge — central triangle pointing down -->
  <polygon class="pri" points="240,244 256,300 272,244"/>

  <!-- Eyes — angular, sharp, terminal green -->
  <polygon class="glow" points="192,260 220,252 220,268"/>
  <polygon class="glow" points="320,260 292,252 292,268"/>

  <!-- Nose tip -->
  <polygon class="pri" points="248,300 256,312 264,300"/>

  <!-- Whisker lines — subtle -->
  <line x1="192" y1="292" x2="128" y2="284" stroke="#D4D4D8" stroke-width="1" opacity="0.2"/>
  <line x1="192" y1="300" x2="128" y2="304" stroke="#D4D4D8" stroke-width="1" opacity="0.2"/>
  <line x1="320" y1="292" x2="384" y2="284" stroke="#D4D4D8" stroke-width="1" opacity="0.2"/>
  <line x1="320" y1="300" x2="384" y2="304" stroke="#D4D4D8" stroke-width="1" opacity="0.2"/>

  <!-- Neck/chest — angular continuation -->
  <polygon class="pri" points="192,332 256,372 320,332 336,420 256,440 176,420"/>

  <!-- Subtle body scan lines -->
  <rect class="dim" x="192" y="380" width="128" height="1"/>
  <rect class="dim" x="188" y="396" width="136" height="1"/>
  <rect class="dim" x="184" y="412" width="144" height="1"/>

</svg>