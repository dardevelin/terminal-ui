<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 576" width="400" height="576">
  <!--
    TerminalUI — Ember Fox (v3-fox-13-ember-compact)

    A faithful render of assets/logo.ans on terminal cell geometry: 5 cells
    wide × 4 rows tall, each cell 64×128px (the ~1:2 aspect of a real terminal
    cell — square cells squash the fox to half height and break the mark).

    Glyph grid, matching the .ans byte for byte:
      Row 0: ▲   ▲   rust ear-backs at cols 0,4
      Row 1: ▲▲▲▲▲   forehead band, orange with pink inner-ear tufts
      Row 2: █●█●█   orange blocks; terminal-green ● pupils on the dark bg
      Row 3: ▜▀▼▀▛   white muzzle, quadrant chin taper, nose as negative space

    Triangle glyphs (▲▼) render as a vertically centered band ~half a cell
    tall, so stacked rows keep the small gaps a terminal shows.
  -->
  <defs>
    <style>
      .bg     { fill: #0A0A0A; }
      .orange { fill: #F2994A; }
      .rust   { fill: #A56A2E; }
      .pink   { fill: #F9C6B8; }
      .white  { fill: #F4F4F4; }
      .green  { fill: #7DE3A6; }
      .nose   { fill: #080808; }
    </style>
  </defs>
  <rect class="bg" width="400" height="576" rx="24"/>
  <g transform="translate(40,32)">
    <!-- Row 0 — ear backs -->
    <polygon class="rust" points="0,96    32,32   64,96"/>
    <polygon class="rust" points="256,96  288,32  320,96"/>

    <!-- Row 1 — forehead band -->
    <polygon class="orange" points="0,224   32,160   64,224"/>
    <polygon class="pink"   points="64,224  96,160  128,224"/>
    <polygon class="orange" points="128,224 160,160 192,224"/>
    <polygon class="pink"   points="192,224 224,160 256,224"/>
    <polygon class="orange" points="256,224 288,160 320,224"/>

    <!-- Row 2 — orange blocks with phosphor-green pupils on the dark ground -->
    <rect class="orange" x="0"   y="256" width="64" height="128"/>
    <rect class="orange" x="128" y="256" width="64" height="128"/>
    <rect class="orange" x="256" y="256" width="64" height="128"/>
    <circle class="green" cx="96"  cy="320" r="24"/>
    <circle class="green" cx="224" cy="320" r="24"/>

    <!-- Row 3 — white muzzle: ▜ and ▛ keep only the inner lower quadrant,
         giving the chin its inward taper; the ▼ nose is near-black on the
         dark ground, reading as the notch between the cheek pads -->
    <rect class="white" x="0"   y="384" width="64" height="64"/>
    <rect class="white" x="32"  y="448" width="32" height="64"/>
    <rect class="white" x="64"  y="384" width="64" height="64"/>
    <polygon class="nose" points="128,416 192,416 160,480"/>
    <rect class="white" x="192" y="384" width="64" height="64"/>
    <rect class="white" x="256" y="384" width="64" height="64"/>
    <rect class="white" x="256" y="448" width="32" height="64"/>
  </g>
</svg>
