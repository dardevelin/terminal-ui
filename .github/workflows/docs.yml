name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploying to Pages needs these; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages deployments are not meaningfully parallel — the last push wins.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: ubuntu-latest
    # Package.swift requires swift-tools-version 6.2; swift:6.0 rejects the
    # manifest outright.
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: .build
          key: docs-spm-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            docs-spm-${{ hashFiles('Package.swift') }}-
            docs-spm-

      # --experimental-skip-synthesized-symbols: without it every view lists
      # every TerminalView modifier again as its own page, and each Equatable
      # type gets a `!=` page — some 3,500 pages that only repeat others.
      # tools/scripts/check_doc_pages.py builds with the same options.
      # TUI_BUILD_DOCS gates the swift-docc-plugin dependency so ordinary
      # consumers resolving this package clone nothing — docs builds are the
      # one place that opts in. The hosting base path must equal the repo
      # name for github.io project pages, so derive it rather than hardcode.
      - name: Generate documentation
        run: |
          TUI_BUILD_DOCS=1 swift package \
            --allow-writing-to-directory docs-site \
            generate-documentation \
            --target TerminalUI \
            --experimental-skip-synthesized-symbols \
            --output-path docs-site \
            --transform-for-static-hosting \
            --hosting-base-path "${{ github.event.repository.name }}"

      # DocC's static site 404s at the bare root. Replace it with the
      # landing page: a selector between Tutorials, the in-depth reference,
      # and the sample download. Deep routes keep their own SPA bootstrap
      # copies, so overwriting the root is safe.
      - name: Install landing page
        run: |
          cp .github/pages/index.html docs-site/index.html
          cp assets/logo.svg docs-site/logo.svg
          cp assets/demo.gif docs-site/demo.gif

      # Inside tutorials, reference links open in a slide-over panel instead
      # of navigating away — inject the enhancement into every SPA bootstrap
      # copy (the landing page is plain HTML and takes no injection).
      - name: Inject tutorial reference pane and render fixes
        run: |
          cp .github/pages/reference-pane.js docs-site/reference-pane.js
          cp .github/pages/reference-pane.css docs-site/reference-pane.css
          cp .github/pages/docc-fixes.css docs-site/docc-fixes.css
          base="/${{ github.event.repository.name }}"
          snippet="<link rel=\"stylesheet\" href=\"$base/docc-fixes.css\"><link rel=\"stylesheet\" href=\"$base/reference-pane.css\"><script src=\"$base/reference-pane.js\"></script></body>"
          find docs-site -mindepth 2 -name index.html -print0 |
            xargs -0 sed -i "s|</body>|$snippet|"

      # Every chapter's last step is a complete program; each is packaged as
      # a download — the starting point a later chapter links to — and the
      # course's last, chapter 7's, is also the finished sample the landing
      # page offers. One source of truth: the tutorial resources themselves.
      # The swift image ships no zip binary — install it, as CI does for
      # python3.
      - name: Build sample project downloads
        run: |
          apt-get update -qq && apt-get install -y -qq zip
          mkdir -p docs-site/downloads
          package() {  # step, zip name, what it is
            rm -rf sample && mkdir -p sample/Tasks/Sources/Tasks
            cp "Sources/TerminalUI/TerminalUI.docc/Resources/$1.swift" sample/Tasks/Sources/Tasks/main.swift
            cat > sample/Tasks/Package.swift <<'MANIFEST'
          // swift-tools-version: 6.2
          import PackageDescription

          let package = Package(
              name: "Tasks",
              platforms: [.macOS(.v15)],
              dependencies: [
                  .package(url: "https://github.com/dardevelin/terminal-ui", branch: "main"),
              ],
              targets: [
                  .executableTarget(
                      name: "Tasks",
                      dependencies: [.product(name: "TerminalUI", package: "terminal-ui")]
                  ),
              ]
          )
          MANIFEST
            printf '# Tasks — the TerminalUI tutorial app\n\n%s\n\n    swift run\n' "$3" > sample/Tasks/README.md
            (cd sample && zip -qr "../docs-site/downloads/$2" Tasks)
          }
          package tasks-04-01  tasks-chapter-1.zip "The task list as chapter 1, Foundations, leaves it."
          package tasks2-03-01 tasks-chapter-2.zip "The task list as chapter 2, Interaction, leaves it."
          package tasks3-03-01 tasks-chapter-3.zip "The task list as chapter 3, Structure, leaves it."
          package tasks4-03-01 tasks-chapter-4.zip "The task list as chapter 4, Navigation, leaves it."
          package tasks5-03-01 tasks-chapter-5.zip "The task list as chapter 5, Data, leaves it."
          package tasks6-03-01 tasks-chapter-6.zip "The task list as chapter 6, Production, leaves it."
          package tasks7-03-01 tasks-chapter-7.zip "The task list as chapter 7, Architecture, leaves it."
          package tasks7-03-01 build-a-task-list.zip "The finished app from the TerminalUI tutorials. Type and Enter to add a task, Up and Down to move, Enter on an empty prompt to toggle, Backspace on an empty prompt to delete, Tab between panes, 1 and 2 for tabs, Escape to quit."

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
