name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an in-flight run obsolete. Never
  # cancel main — its runs are the record of what actually shipped.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Linux (Swift 6.2)
    runs-on: ubuntu-latest
    # Package.swift requires swift-tools-version 6.2; swift:6.0 rejects the
    # manifest outright.
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            linux-spm-${{ hashFiles('Package.swift') }}-
            linux-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Strict gate. -warnings-as-errors is deliberately NOT in Package.swift's
      # default settings — that would propagate the policy to downstream
      # consumers, which the Swift Package Index forbids for libraries. The env
      # var is the opt-in this repo's CI uses.
      - name: Build with warnings as errors
        run: TUI_WARNINGS_AS_ERRORS=1 swift build

      - name: Build release
        run: TUI_WARNINGS_AS_ERRORS=1 swift build -c release

      # The visual harness drives real apps through a PTY. It needs a Python
      # interpreter, which the swift image does not ship — that missing
      # interpreter, not any TTY limitation, is why this had never run in a
      # container. pty.fork() allocates its own terminal, so the runner having
      # no TTY on stdin is fine.
      - name: Install Python for the PTY harness
        run: apt-get update -qq && apt-get install -y -qq python3

      - name: Walk every Storybook page
        run: python3 tools/scripts/storybook_walk.py

      - name: Behavioural smoke suite
        run: python3 tools/scripts/storybook_smoke.py

  macos:
    name: macOS (Swift 6.2)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # The runner's default Xcode ships Swift 6.1; the manifest requires
      # 6.2 (swift:6.0/6.1 reject the file). Pick the newest Xcode on the
      # image and prove the toolchain before building.
      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      # Every @unchecked Sendable / nonisolated(unsafe) must be listed with
      # what guards it; each race this framework shipped sat behind one.
      - name: Concurrency escape hatches are listed
        run: python3 tools/scripts/check_escape_hatches.py

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            macos-spm-${{ hashFiles('Package.swift') }}-
            macos-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build with warnings as errors
        run: TUI_WARNINGS_AS_ERRORS=1 swift build

      - name: Build release
        run: TUI_WARNINGS_AS_ERRORS=1 swift build -c release

      # macOS runners ship Python 3, so no install step is needed here.
      - name: Walk every Storybook page
        run: python3 tools/scripts/storybook_walk.py

      - name: Behavioural smoke suite
        run: python3 tools/scripts/storybook_smoke.py

  thread-sanitizer:
    name: Thread Sanitizer (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      # Its own scratch path: a sanitized build shares no artifacts with a
      # plain one, and mixing them in one .build rebuilds both every time.
      - name: Cache build
        uses: actions/cache@v5
        with:
          path: .build-tsan
          key: macos-tsan-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            macos-tsan-${{ hashFiles('Package.swift') }}-
            macos-tsan-

      # A race is a bug whether or not a run happens to crash on it. TSan
      # reports the unguarded access itself, so the trace recorder's race,
      # which crashed one smoke run in three, fails every run here.
      - name: Test
        run: swift test --sanitize=thread --scratch-path .build-tsan

      # The unit tests mostly run on one actor; the threads that race in a
      # live app are the input task, the frame loop and the control socket.
      # The runner sends each app's sanitizer reports to a file and fails the
      # case that produced them.
      - name: Build examples
        run: swift build --sanitize=thread --scratch-path .build-tsan

      - name: Behavioural smoke suite
        run: python3 tools/scripts/storybook_smoke.py .build-tsan/debug
