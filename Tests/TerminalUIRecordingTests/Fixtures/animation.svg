<svg xmlns="http://www.w3.org/2000/svg" width="132" height="78" viewBox="0 0 132 78" font-family='"JetBrains Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace' font-size="15" xml:space="preserve">
<title>animation</title>
<desc>A terminal screen recorded by TerminalUI. Bold text is drawn in a heavier weight, not a brighter colour. Box drawing, block elements, braille and the framework&apos;s marks are drawn as shapes, not from a font. It plays as an animation; where animation is off or motion is reduced, it shows its last frame.</desc>
<style>
@keyframes k1{0%{visibility:hidden}22.222%{visibility:visible}}
#f1{animation:k1 4500ms step-end infinite}
@keyframes k2{0%{visibility:hidden}44.444%{visibility:visible}}
#f2{animation:k2 4500ms step-end infinite}
@media (prefers-reduced-motion: reduce){g{animation:none!important}}
</style>
